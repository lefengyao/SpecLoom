<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="git-header">
    <div class="git-title">
      <h1>Git</h1>
      <span id="repo-state" class="pill">读取中</span>
      <span id="branch-name" class="branch"></span>
      <span id="sync-counts" class="sync"></span>
    </div>
    <div class="git-actions">
      <button id="init-button" class="primary" hidden>初始化仓库</button>
      <button id="fetch-button">获取</button>
      <button id="pull-button">拉取</button>
      <button id="push-button">推送</button>
      <button id="refresh-button" class="ghost" title="刷新">刷新</button>
    </div>
  </header>
  <div id="error" class="error" role="alert" hidden></div>
  <main class="git-layout">
    <section class="panel files-panel">
      <div class="panel-heading"><h2>变更</h2><span id="file-count" class="muted"></span></div>
      <div id="file-list" class="file-list"><p class="empty">读取中…</p></div>
    </section>
    <section class="panel diff-panel">
      <div class="panel-heading"><h2 id="diff-title">差异</h2><span id="diff-actions"></span></div>
      <pre id="diff-view" class="diff-view">选择一个文件查看差异。</pre>
    </section>
    <aside class="panel side-panel">
      <div id="commit-panel">
        <h2>提交</h2>
        <textarea id="commit-message" maxlength="20000" placeholder="提交说明"></textarea>
        <button id="commit-button" class="primary">提交已暂存变更</button>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="branches" role="tab" aria-selected="true">分支</button>
        <button class="tab" data-tab="history" role="tab" aria-selected="false">历史</button>
      </div>
      <div id="branches-view" class="tab-panel">
        <button id="new-branch" class="ghost">新建分支</button>
        <div id="branch-list" class="branch-list"></div>
      </div>
      <div id="history-view" class="tab-panel" hidden>
        <div id="history-list" class="history-list"></div>
      </div>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
