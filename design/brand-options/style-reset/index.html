<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpecLoom · 圆润扁平 Logo</title>
    <style>
      * { box-sizing: border-box; }
      :root { font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; color: #294036; background: #f0f2eb; color-scheme: light; }
      body { margin: 0; }
      .sheet { max-width: 1440px; margin: 0 auto; padding: 40px 48px 26px; background: #f7f8f1; }
      header { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 28px; gap: 20px; }
      h1 { margin: 0; font-size: 34px; font-weight: 700; line-height: 1.2; }
      header p { margin: 9px 0 0; font-size: 13px; color: #758579; }
      .edition { font-size: 11px; color: #879487; }
      .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
      article { overflow: hidden; min-width: 0; background: #fff; border: 1px solid #dee5da; border-radius: 20px; }
      .label { padding: 24px 28px 0; display: flex; align-items: center; gap: 12px; }
      .number { font-size: 11px; color: #92a18e; }
      h2 { margin: 0; font-size: 15px; font-weight: 600; }
      .display { height: 328px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
      .mark { width: 190px; height: 190px; object-fit: contain; }
      .wordmark { font-size: 32px; font-weight: 650; line-height: 1; letter-spacing: -0.7px; }
      .samples { height: 120px; padding: 20px; display: flex; align-items: center; justify-content: center; gap: 28px; background: #eef2e8; }
      .badge { width: 80px; height: 80px; display: grid; place-items: center; background: #fff5d7; border-radius: 50%; }
      .badge img { width: 64px; height: 64px; object-fit: contain; }
      .mono { width: 48px; height: 48px; object-fit: contain; filter: brightness(0); }
      .mono.small { width: 24px; height: 24px; }
      .dark { width: 58px; height: 58px; display: grid; place-items: center; background: #294036; border-radius: 12px; }
      .dark img { width: 44px; height: 44px; object-fit: contain; filter: brightness(0) invert(1); }
      .caption { margin: 0; padding: 18px 28px 20px; font-size: 12px; line-height: 1.8; color: #84927e; }
      footer { display: flex; justify-content: space-between; gap: 18px; padding-top: 23px; font-size: 11px; color: #929d8b; }
      @media (max-width: 900px) { .sheet { padding: 28px 24px 22px; } .samples { gap: 18px; } .badge { width: 72px; height: 72px; } .badge img { width: 58px; height: 58px; } .mono { width: 40px; height: 40px; } }
      @media (max-width: 620px) { .sheet { padding: 24px 16px 20px; } .options { grid-template-columns: minmax(0, 1fr); gap: 20px; } h1 { font-size: 30px; } .edition { display: none; } .display { height: 316px; } .samples { gap: 20px; } footer { flex-wrap: wrap; } }
    </style>
  </head>
  <body>
    <main class="sheet">
      <header><div><h1>SpecLoom</h1><p>圆润扁平 / 游戏角色徽章</p></div><div class="edition">FLAT COMPANIONS</div></header>
      <section class="options" aria-label="圆润扁平候选">
        <article>
          <div class="label"><span class="number">A</span><h2>织团精灵</h2></div>
          <div class="display"><img class="mark" src="01-rounded.svg" alt="织团精灵" /><div class="wordmark">SpecLoom</div></div>
          <div class="samples"><div class="badge"><img src="01-rounded.svg" alt="圆形角色徽章" /></div><img class="mono small" src="01-rounded.svg" alt="24 像素单色" /><img class="mono" src="01-rounded.svg" alt="48 像素单色" /><div class="dark"><img src="01-rounded.svg" alt="深色背景反白" /></div></div>
          <p class="caption">圆形织团与弯曲线尾，更像有动作的小伙伴。</p>
        </article>
        <article>
          <div class="label"><span class="number">B</span><h2>软线轴伙伴</h2></div>
          <div class="display"><img class="mark" src="02-rounded.svg" alt="软线轴伙伴" /><div class="wordmark">SpecLoom</div></div>
          <div class="samples"><div class="badge"><img src="02-rounded.svg" alt="圆形角色徽章" /></div><img class="mono small" src="02-rounded.svg" alt="24 像素单色" /><img class="mono" src="02-rounded.svg" alt="48 像素单色" /><div class="dark"><img src="02-rounded.svg" alt="深色背景反白" /></div></div>
          <p class="caption">把线轴变成圆角角色，保留织造工具的识别点。</p>
        </article>
      </section>
      <footer><span>SpecLoom / 织布机</span><span>STYLE RESET · A / B</span></footer>
    </main>
  </body>
</html>
